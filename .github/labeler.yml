  - *.md

Build System:
  - CMakeLists.txt
  - cmake/**/*
  - vcpkg.json

CI/CD:
  - .github/workflows/**/*
  - .github/actions/**/*

Python:
  - src/lib/python/**/*
  - requirements.txt
