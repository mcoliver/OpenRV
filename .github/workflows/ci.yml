name: OpenRV

on:
  push:
    branches:
      # This will run when PR is merged or direct pushes to main.
      - main

  pull_request: # This handles PR creation and subsequent commits.

  schedule:
    # Midnight build every day
    - cron: "0 0 * * *"

  # This allows manual triggering of the workflow from the web
  workflow_dispatch:
    inputs:
      SKIP_DEPS_CACHE:
        description: 'Skip dependencies caching'
        required: true
        default: 'false'

jobs:
  detect-changes:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    runs-on: ubuntu-latest
    outputs:
      cmake_changed: ${{ steps.filter.outputs.cmake }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            cmake:
              - 'cmake/**'
              - '**/CMakeLists.txt'
              - '**/*.cmake'

  linux:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    needs: detect-changes
    uses: ./.github/workflows/ci-linux.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      qt5_modules: 'debug_info qtcharts qtdatavis3d qtlottie qtnetworkauth qtquick3d qtquicktimeline qtscript qtwebengine qtwebglplugin'
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}

  macos:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    needs: detect-changes
    uses: ./.github/workflows/ci-macos.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      qt5_modules: 'debug_info qtcharts qtdatavis3d qtlottie qtnetworkauth qtquick3d qtquicktimeline qtscript qtwebengine qtwebglplugin'
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}

  windows:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    needs: detect-changes
    uses: ./.github/workflows/ci-windows.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      qt5_modules: 'debug_info qtcharts qtdatavis3d qtlottie qtnetworkauth qtquick3d qtquicktimeline qtscript qtwebengine qtwebglplugin'
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}

  test-results:
    if: github.repository_owner == 'AcademySoftwareFoundation' && always()
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    steps:
      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          path: test-results
          pattern: test-results-*
          merge-multiple: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "test-results/**/*.xml"

  coverage:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Coverage Data
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-linux-9-CY2024-Debug # We'll use Linux Debug for coverage
          path: coverage-data

      # In a real scenario, we'd run a dedicated coverage build.
      # For now, I'm adding the infrastructure to encourage it.
      - name: Report Coverage
        run: |
          echo "Code coverage reporting infrastructure initialized."
          # This would typically call a service like Codecov or generate an lcov report